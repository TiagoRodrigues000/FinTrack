{% extends 'base.html' %}
{% block title %}Cadastro{% endblock %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">FT</div>
      <span class="logo-text">FinTrack</span>
    </div>
    <h1 class="auth-title">Crie sua conta</h1>
    <p class="auth-sub">Comece a controlar suas finanças hoje, de graça</p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">Nome completo</label>
        <input type="text" name="name" class="form-control" placeholder="Seu nome" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" name="password" id="pwd" class="form-control" placeholder="Mínimo 6 caracteres" required>
          <button type="button" class="input-eye" onclick="togglePwd()">
            <i data-lucide="eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirmar senha</label>
        <input type="password" name="confirm" class="form-control" placeholder="Repita a senha" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px;margin-top:6px">
        <i data-lucide="user-plus"></i> Criar conta
      </button>
    </form>

    <div class="auth-footer">
      Já tem conta? <a href="{{ url_for('auth.login') }}">Faça login</a>
    </div>
  </div>
</div>
<script>
  function togglePwd() {
    const p = document.getElementById('pwd');
    const i = document.getElementById('eye-icon');
    if (p.type === 'password') { p.type = 'text'; i.setAttribute('data-lucide','eye-off'); }
    else { p.type = 'password'; i.setAttribute('data-lucide','eye'); }
    lucide.createIcons();
  }
</script>
{% endblock %}
