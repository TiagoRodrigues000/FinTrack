{% extends 'base.html' %}
{% block title %}Entrar{% endblock %}
{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-mark">FT</div>
      <span class="logo-text">FinTrack</span>
    </div>
    <h1 class="auth-title">Bem-vindo de volta</h1>
    <p class="auth-sub">Faça login para acessar seu painel financeiro</p>

    <form method="POST">
      <div class="form-group">
        <label class="form-label">E-mail</label>
        <input type="email" name="email" class="form-control" placeholder="seu@email.com" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Senha</label>
        <div class="input-group">
          <input type="password" name="password" id="pwd" class="form-control" placeholder="••••••••" required>
          <button type="button" class="input-eye" onclick="togglePwd()">
            <i data-lucide="eye" id="eye-icon"></i>
          </button>
        </div>
      </div>
      <div class="form-group flex gap-2" style="margin-bottom:22px">
        <input type="checkbox" name="remember" id="remember" style="accent-color:var(--green)">
        <label for="remember" style="font-size:13px;color:var(--muted);cursor:pointer">Lembrar de mim</label>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:11px">
        <i data-lucide="log-in"></i> Entrar
      </button>
    </form>

    <div class="auth-footer">
      Não tem conta? <a href="{{ url_for('auth.register') }}">Cadastre-se grátis</a>
    </div>
  </div>
</div>
<script>
  function togglePwd() {
    const p = document.getElementById('pwd');
    const i = document.getElementById('eye-icon');
    if (p.type === 'password') { p.type = 'text'; i.setAttribute('data-lucide','eye-off'); }
    else { p.type = 'password'; i.setAttribute('data-lucide','eye'); }
    lucide.createIcons();
  }
</script>
{% endblock %}
